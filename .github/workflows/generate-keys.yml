name: 🔑 Key Yenile (24 Saatte Bir)
on:
  schedule:
    - cron: '0 0 * * *'   # Her gün gece 00:00'da çalışır
  workflow_dispatch:        # Elle de çalıştırabilirsin
jobs:
  generate-keys:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu indir
        uses: actions/checkout@v3
      - name: Python kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Yeni keyler üret
        run: |
          python3 - <<'EOF'
          import random
          import string
          def generate_key():
              part = lambda n: ''.join(random.choices(string.ascii_uppercase + string.digits, k=n))
              return f"MM2-{part(4)}-{part(4)}-{part(4)}"
          keys = [generate_key() for _ in range(50)]
          with open("mm2-keys", "w") as f:
              f.write("\n".join(keys))
          print("✅ 50 yeni key üretildi!")
          for k in keys:
              print(k)
          EOF
      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
